<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Карточка записи</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 720px;
    margin: 2rem auto;
    padding: 0 1rem;
    color: #222;
  }
  h1 { margin-bottom: .25rem; }
  .muted { color: #666; font-size: .9rem; }
  .card {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 1rem 1.25rem;
    margin-top: 1rem;
  }
  .card h2 {
    font-size: 1rem;
    margin: 0 0 .5rem;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: #555;
  }
  .row {
    display: grid;
    grid-template-columns: 160px 1fr;
    gap: .25rem 1rem;
    padding: .25rem 0;
  }
  .row .label { color: #666; }
  .status {
    display: inline-block;
    padding: .15rem .5rem;
    border-radius: 4px;
    font-size: .85rem;
    font-weight: 600;
  }
  .status.active    { background: #e3f7e6; color: #1e7a33; }
  .status.cancelled { background: #fde8e8; color: #a12222; }
  .status.free      { background: #eef2ff; color: #3448a3; }
  .status.booked    { background: #fff3cd; color: #8a5a00; }
  .actions { margin-top: 1rem; display: flex; gap: .5rem; }
  button {
    font: inherit;
    padding: .5rem .9rem;
    border-radius: 6px;
    border: 1px solid #bbb;
    background: #f7f7f7;
    cursor: pointer;
  }
  button:hover { background: #eee; }
  button.danger { border-color: #d88; color: #a12222; }
  button.danger:hover { background: #fdeaea; }
  .error {
    border: 1px solid #e0a0a0;
    background: #fff5f5;
    color: #a12222;
    padding: .75rem 1rem;
    border-radius: 6px;
    margin-top: 1rem;
  }
  a.back { display: inline-block; margin-top: 1.5rem; color: #444; }
</style>
</head>
<body>

<h1>Карточка записи</h1>
<p class="muted" id="subtitle">Загрузка…</p>

<div id="content"></div>

<a class="back" href="/static/appointments.html">← К списку записей</a>

<script>
(function () {
  const params = new URLSearchParams(location.search);
  const id = params.get("id");
  const subtitle = document.getElementById("subtitle");
  const content = document.getElementById("content");

  if (!id) {
    subtitle.textContent = "";
    showError("Не передан параметр ?id=<номер записи> в адресе.");
    return;
  }

  // ---- авторизация ----
  // Токен ожидается в localStorage под ключом "token".
  // Если у вас cookie-сессии — уберите Authorization и положитесь на cookie.
  const token = localStorage.getItem("token");

  async function api(path, options = {}) {
    const headers = Object.assign(
      { "Accept": "application/json" },
      options.headers || {}
    );
    if (token) headers["Authorization"] = "Bearer " + token;

    const response = await fetch(path, Object.assign({}, options, { headers }));
    return response;
  }

  // ---- рендер ----
  function escapeHtml(value) {
    if (value === null || value === undefined) return "—";
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;");
  }

  function statusBadge(status) {
    const cls = ["active", "cancelled", "free", "booked"].includes(status)
      ? status
      : "";
    return `<span class="status ${cls}">${escapeHtml(status)}</span>`;
  }

  function row(label, value) {
    return `<div class="row"><div class="label">${label}</div><div>${value}</div></div>`;
  }

  function fmtDateTime(iso) {
    if (!iso) return "—";
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    return d.toLocaleString("ru-RU");
  }

  function render(data) {
    subtitle.textContent = `Запись #${data.id}`;

    const slot = data.slot || {};
    const service = data.service || {};
    const specialist = data.specialist || {};

    let html = "";

    html += `<div class="card">
      <h2>Основное</h2>
      ${row("Клиент", escapeHtml(data.client_name))}
      ${row("Статус", statusBadge(data.status))}
      ${row("Создана", escapeHtml(fmtDateTime(data.created_at)))}
    </div>`;

    html += `<div class="card">
      <h2>Слот</h2>
      ${row("Дата", escapeHtml(slot.slot_date))}
      ${row("Время", `${escapeHtml(slot.start_time)} — ${escapeHtml(slot.end_time)}`)}
      ${row("Статус слота", slot.status ? statusBadge(slot.status) : "—")}
    </div>`;

    html += `<div class="card">
      <h2>Услуга</h2>
      ${row("Название", escapeHtml(service.name))}
      ${row("Длительность", service.duration_minutes ? service.duration_minutes + " мин" : "—")}
    </div>`;

    html += `<div class="card">
      <h2>Специалист</h2>
      ${row("Имя", escapeHtml(specialist.name))}
      ${row("Специализация", escapeHtml(specialist.specialization))}
    </div>`;

    html += `<div class="actions">
      <button id="cancel-btn" class="danger" ${data.status !== "active" ? "disabled" : ""}>
        Отменить запись
      </button>
    </div>`;

    content.innerHTML = html;

    const cancelBtn = document.getElementById("cancel-btn");
    if (cancelBtn && data.status === "active") {
      cancelBtn.addEventListener("click", () => cancelAppointment(data.id));
    }
  }

  function showError(message) {
    content.innerHTML = `<div class="error">${escapeHtml(message)}</div>`;
  }

  // ---- сценарии ----
  async function load() {
    try {
      const response = await api(`/appointments/${encodeURIComponent(id)}`);

      if (response.status === 401) {
        subtitle.textContent = "";
        showError("Требуется вход. Токен не найден или истёк.");
        return;
      }
      if (response.status === 404) {
        subtitle.textContent = "";
        showError("Запись не найдена.");
        return;
      }
      if (!response.ok) {
        subtitle.textContent = "";
        showError("Ошибка сервера: " + response.status);
        return;
      }

      const data = await response.json();
      render(data);
    } catch (err) {
      subtitle.textContent = "";
      showError("Не удалось получить данные: " + err.message);
    }
  }

  async function cancelAppointment(appointmentId) {
    const confirmed = confirm(`Отменить запись #${appointmentId}?`);
    if (!confirmed) return;

    try {
      const response = await api(`/appointments/${appointmentId}`, {
        method: "DELETE",
      });

      if (response.status === 401) { showError("Требуется вход."); return; }
      if (response.status === 404) { showError("Запись не найдена."); return; }
      if (response.status === 400) {
        const body = await response.json().catch(() => ({}));
        showError(body.detail || "Отмена невозможна.");
        return;
      }
      if (!response.ok) { showError("Ошибка сервера: " + response.status); return; }

      // Перезагружаем карточку, чтобы увидеть новое состояние
      load();
    } catch (err) {
      showError("Не удалось отменить: " + err.message);
    }
  }

  load();
})();
</script>
</body>
</html>
